name: Build 文心 APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'wenxin-mobile.user.js'
      - '.github/workflows/android.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept licenses & install SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "sdk=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Verify injected bootstrap JS (javac + node --check)
        run: |
          javac --release 17 -d /tmp/gen \
            android/app/src/main/java/com/hiweny/wenxin/InlineJs.java \
            android/tools/Gen.java
          java -cp /tmp/gen com.hiweny.wenxin.Gen wenxin-mobile.user.js /tmp/bootstrap.js dark
          node --check /tmp/bootstrap.js

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ok=0
          for i in 1 2 3; do
            if ./gradlew assembleRelease --no-daemon --stacktrace; then ok=1; break; fi
            echo "=== gradle attempt $i failed, retrying ==="
            sleep 20
          done
          [ "$ok" = "1" ]

      - name: Collect APK
        run: |
          ls -la android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release.apk Wenxin.apk
          ls -la Wenxin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Wenxin-apk
          path: Wenxin.apk

      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: 文心 APK（最新）
          body: |
            文心助手 · 手机版 WebView 壳
            - 电脑端 UA + 手机端布局（与油猴脚本同源）
            - 全屏沉浸 / 主题跟随系统 / 键盘不闪不遮
          files: Wenxin.apk
          make_latest: true

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Wenxin-apk

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe deps
        run: pip install --quiet websocket-client

      - name: Run APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: timeout 900 bash .github/scripts/smoke.sh || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-artifacts
          path: |
            shots/
            probe.txt
